resources:
  identity: aphw-ddi-portal
  service_bus:
    queues:
      - name: aphw-ddi-certificate-request
        roles:
          - name: sender
    topics:
      - name: aphw-ddi-events
        requiresDuplicateDetection: true
        duplicateDetectionHistoryTimeWindow: PT10M30S
        defaultMessageTimeToLive: P100D
        roles:
          - name: sender
  storage_accounts:
    - name: aphw
      containers:
        - name: uploads
          roles:
            - name: blobContributor
        - name: attachments
          roles:
            - name: blobContributor
        - name: certificates
          roles:
            - name: blobContributor
