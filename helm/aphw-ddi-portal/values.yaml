environment: production
environmentCode:
name: aphw-ddi-portal
namespace: aphw-ddi
workstream: aphw-ddi
image: aphw-ddi-portal

labels:
  component: service

appInsights:
  connectionString:

containerConfigMap:
  name: aphw-ddi-portal

containerSecret:
  name: aphw-ddi-portal

deployment:
  replicas: 1
  minReplicas: 1
  maxReplicas: 4
  cpuThreshold: 80
  memoryThreshold: 400Mi

container:
  requestMemory: 100Mi
  requestCpu: 100m
  limitMemory: 500Mi
  limitCpu: 200m
  port: 3000
  cookiePassword: who-likes-cookies-i-like-cookies-everybody-likes-cookies
  ddiApiBaseUrl: ddi-index-api-base-url
  ddiEventsBaseUrl: ddi-events-api-base-url
  osPlacesBaseUrl: os-places-api-base-url
  policeApiBaseUrl: police-api-base-url
  azureStorageUseConnectionString: false
  azureStorageAccountName: dummy
  messageQueueHost: namespace.servicebus.windows.net
  certificateRequestQueue: aphw-ddi-certificate-request
  redisHostname: dummy
  redisPort: 6379

livenessProbe:
  path: /healthz
  port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  path: /healthy
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

workloadIdentity: true

azureIdentity:
  clientID: not-a-real-clientID
  resourceID: not-a-real-resourceID

ingress:
  class: nginx
  endpoint: ffc-pay-request-editor
  server: example.com

service:
  port: 80
  type: ClusterIP

azureAppRegistration:
  enabled: true
  clientId:
  tenantId:
  redirectUrl: authenticate

secretProviderClass:
  azure:
    keyvaultName: SNDFFCINFKV2001
    objects:
      - objectName: snd2-aphw-appinsights-connectionString
        objectType: secret
      - objectName: snd2-aphw-ddi-portal-clientsecret
        objectType: secret
      - objectName: snd2-aphw-ddi-os-places-key
        objectType: secret
      - objectName: snd2-aphw-ddi-portal-jwt-private-key
        objectType: secret
      - objectName: snd2-redisPassword
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-portal
      type: Opaque
      data:
        - objectName: snd2-aphw-appinsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: snd2-aphw-ddi-portal-clientsecret
          key: AZUREID_CLIENT_SECRET
        - objectName: snd2-aphw-ddi-os-places-key
          key: OS_PLACES_API_KEY
        - objectName: snd2-aphw-ddi-portal-jwt-private-key
          key: JWT_PRIVATE_KEY
        - objectName: snd2-redisPassword
          key: REDIS_PASSWORD
